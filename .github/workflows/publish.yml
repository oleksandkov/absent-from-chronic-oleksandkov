name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_frontend/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:     

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-action@v2

      - name: Restore R packages (renv)
        shell: Rscript
        run: |
          if (file.exists('renv.lock')) {
            message('Restoring renv packages...')
            renv::restore(prompt = FALSE)
          } else {
            message('No renv.lock found, skipping renv restore')
          }

      - name: Render analysis reports (EDA-2, EDA-5)
        shell: bash
        run: |
          set -euo pipefail
          echo "Rendering EDA-2..."
          Rscript analysis/eda-2/eda-2.R || true
          quarto render analysis/eda-2/eda-2.qmd || true
          echo "Rendering EDA-5..."
          Rscript analysis/eda-5/eda-5.R || true
          quarto render analysis/eda-5/eda-5.qmd || true

      - name: Build frontend site
        shell: bash
        run: |
          set -euo pipefail
          echo "Rendering frontend (_frontend)..."
          quarto render _frontend || true
          echo "Site built at _frontend/_site"
          echo "SITE_DIR=_frontend/_site" >> "$GITHUB_ENV"
          ls -lh _frontend/_site | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
