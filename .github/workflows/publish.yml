name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_frontend-1/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:      # optional manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R (required by Quarto pre/post-render hooks)
        uses: r-lib/actions/setup-r@v2

      - name: Render _frontend-1 site
        working-directory: _frontend-1
        run: quarto render

      - name: Locate rendered site directory
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $PWD"
          echo "Top-level folders:"
          ls -la

          CANDIDATES=(
            "_frontend-1/_site"
            "_site"
          )

          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "Found site directory: $d"
              echo "SITE_DIR=$d" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "Could not find rendered site directory. Search results:"
          find . -maxdepth 5 -type d -name "_site" -print || true
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
