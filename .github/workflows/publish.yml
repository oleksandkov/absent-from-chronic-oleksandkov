name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_frontend-1/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:      # optional manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R (required by Quarto pre/post-render hooks)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev

      - name: Restore R dependencies from renv.lock
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render _frontend-1 site
        working-directory: _frontend-1
        run: |
          set -x
          echo "Current directory: $(pwd)"
          echo "R version:"
          Rscript --version
          echo "Quarto version:"
          quarto --version
          echo "Starting Quarto render..."
          quarto render --verbose
          echo "Render complete. Checking output..."
          ls -la _site || echo "⚠ _site not found"
          exit_code=$?
          exit $exit_code

      - name: Locate rendered site directory
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $PWD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Checking for _site directory..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # After rendering in _frontend-1, the site should be at _frontend-1/_site
          if [ -d "_frontend-1/_site" ]; then
            echo "✓ FOUND: _frontend-1/_site"
            echo "SITE_DIR=_frontend-1/_site" >> "$GITHUB_ENV"
            echo "Site contents:"
            ls -lh _frontend-1/_site | head -20
            exit 0
          fi
          
          # Debug: show full directory structure
          echo "✗ ERROR: Could not find _site directory"
          echo ""
          echo "_frontend-1 contents:"
          ls -lha _frontend-1/ || echo "  _frontend-1 directory not found"
          echo ""
          echo "Search for any _site directories:"
          find . -type d -name "_site" 2>/dev/null || echo "  No _site directories found"
          echo ""
          echo "Current working directory tree (first 30 lines):"
          find . -type f -name "*.html" 2>/dev/null | head -10 || echo "  No HTML files found"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
